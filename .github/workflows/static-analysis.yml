name: Task 8 - Pylint static code analysis

on:
  push:
    branches: [main]
    paths:
      - "server.py"
      - ".github/workflows/static-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Run Flask tests and Pylint without disabling checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Pylint
        run: python -m pip install -r requirements.txt "pylint>=3.3,<4"
      - name: Run application unit tests
        run: python -m unittest -v test_server test_emotion_detection
      - name: Analyze server.py with Pylint
        run: python -m pylint server.py --score=y --output-format=text
