name: Task 5 - EmotionDetection unit tests

on:
  push:
    branches: [main]
    paths:
      - "test_emotion_detection.py"
      - "EmotionDetection/**"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Validate 11 offline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install requests
      - name: Verify Python syntax
        run: python -m compileall -q EmotionDetection test_emotion_detection.py
      - name: Execute 11 unit tests (Watson mocked)
        run: python -m unittest -v test_emotion_detection
